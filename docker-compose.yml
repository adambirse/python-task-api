# Local development stack: PostgreSQL plus the API.
#   docker compose up --build
# Then open http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
      POSTGRES_DB: taskapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://taskapi:taskapi@db:5432/taskapi
      JWT_SECRET_KEY: local-dev-secret-change-me-please
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin-password-123
    ports:
      - "8000:8000"

volumes:
  pgdata:
