name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskapi
          POSTGRES_PASSWORD: taskapi
          POSTGRES_DB: taskapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskapi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskapi:taskapi@localhost:5432/taskapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Test
        run: pytest --cov=app --cov-report=term-missing
